<!doctype html>
<html lang="es" class="" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#142C6B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Consulta de pagos" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A|R SYSTEM</title>
    <script>
      // Aplica el tema guardado antes del primer pintado: sin esto, quien usa el tema
      // oscuro ve un destello claro mientras carga la app. Misma clave que next-themes.
      try {
        var theme = localStorage.getItem('theme')
        var dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
